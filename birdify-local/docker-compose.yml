networks:
  birdify-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  db-primary-data:
  db-replica1-data:
  db-replica2-data:
  storage-data:

services:

  db-primary:
    image: supabase/postgres:15.1.0.147
    container_name: db-primary
    restart: unless-stopped
    networks:
      birdify-net:
        ipv4_address: 172.20.0.10
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-primary-data:/var/lib/postgresql/data
      - ./config/pg-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./config/init-replication.sql:/docker-entrypoint-initdb.d/01-replication.sql:ro
      - ./storage.sql:/docker-entrypoint-initdb.d/02-storage.sql:ro 
      - ./config/run-migrations.sql:/docker-entrypoint-initdb.d/03-run-migrations.sql:ro
      - ./migration:/migration:ro
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf

  db-replica1:
    image: supabase/postgres:15.1.0.147
    container_name: db-replica1
    restart: unless-stopped
    depends_on:
      - db-primary
    networks:
      birdify-net:
        ipv4_address: 172.20.0.11
    ports:
      - "5433:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      SLOT_NAME: slot_replica1
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - db-replica1-data:/var/lib/postgresql/data
      - ./config/pg-replica.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./config/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/init-replica.sh"]

  db-replica2:
    image: supabase/postgres:15.1.0.147
    container_name: db-replica2
    restart: unless-stopped
    depends_on:
      - db-primary
    networks:
      birdify-net:
        ipv4_address: 172.20.0.12
    ports:
      - "5434:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      SLOT_NAME: slot_replica2
      REPLICATION_USER: ${REPLICATION_USER}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes:
      - db-replica2-data:/var/lib/postgresql/data
      - ./config/pg-replica.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./config/init-replica.sh:/usr/local/bin/init-replica.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/init-replica.sh"]

  kong:
    image: kong:2.8.1
    container_name: supabase-kong
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - birdify-net
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
    volumes:
      - ./config/kong.yml:/var/lib/kong/kong.yml:ro

  db-proxy:
    image: haproxy:2.4
    container_name: db-proxy
    restart: unless-stopped
    networks:
      birdify-net:
        ipv4_address: 172.20.0.20
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

  failover-monitor:
    image: postgres:15-alpine
    container_name: failover-monitor
    restart: unless-stopped
    depends_on:
      - db-proxy
    networks:
      - birdify-net
    volumes:
      - ./config/failover-monitor.sh:/usr/local/bin/failover-monitor.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/failover-monitor.sh"]

  auth:
    image: supabase/gotrue:v2.132.3
    container_name: supabase-auth
    restart: unless-stopped
    depends_on:
      - db-primary
    networks:
      - birdify-net
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://${TU_IP_LOCAL}:8000/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db-proxy:5432/${POSTGRES_DB}
      GOTRUE_SITE_URL: http://${TU_IP_LOCAL}:3000
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: noreply@birdify.local
      GOTRUE_SMTP_HOST: inbucket
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_SENDER_NAME: Birdify Local
      GOTRUE_MAILER_AUTOCONFIRM: "false"

  rest:
    image: postgrest/postgrest:v11.2.0
    container_name: supabase-rest
    restart: unless-stopped
    depends_on:
      - db-primary
    networks:
      - birdify-net
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db-proxy:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMA: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  realtime:
    image: supabase/realtime:v2.25.50
    container_name: supabase-realtime
    restart: unless-stopped
    depends_on:
      - db-primary
    networks:
      - birdify-net
    environment:
      APP_NAME: "realtime"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: "-proto_dist inet_tcp"
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
      API_JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db-proxy
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: "supabaserealtime"
      PORT: "4000"
      FLY_ALLOC_ID: "fly123"
      FLY_APP_NAME: "realtime"
      REGION: "default"
      FLY_REGION: "default"
      REPLICATION_MODE: RLS
      REPLICATION_POLL_INTERVAL: 100
      SECURE_CHANNELS: "true"
      SLOT_NAME: "supabase_realtime_rls"
      TEMPORARY_SLOT: "true"


  meta:
    image: supabase/postgres-meta:v0.68.0
    container_name: supabase-meta
    restart: unless-stopped
    depends_on:
      - db-primary
    networks:
      - birdify-net
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db-proxy
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: "postgres"

  storage:
    image: supabase/storage-api:v0.43.0
    container_name: supabase-storage
    restart: unless-stopped
    depends_on:
      - db-primary
    networks:
      - birdify-net
    ports:
      - "5000:5000"
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY}
      SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db-proxy:5432/${POSTGRES_DB}
      DB_SEARCH_PATH: storage,public
      POSTGRES_SEARCH_PATH: storage,public
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      
      REGION: local
      GLOBAL_S3_BUCKET: stub
      TENANT_ID: storage
      ENABLE_IMAGE_TRANSFORMATION: "true"
      DB_SCHEMA: storage
      SCHEMA: storage
      PGRST_DB_SCHEMA: storage
    volumes:
      - storage-data:/var/lib/storage

  studio:
    image: supabase/studio:latest
    container_name: supabase-studio
    restart: unless-stopped
    depends_on:
      - meta
    networks:
      - birdify-net
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db-primary
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME}
      DEFAULT_PROJECT_NAME: ${DEFAULT_PROJECT_NAME}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://${TU_IP_LOCAL}:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      NEXT_PUBLIC_SITE_URL: http://${TU_IP_LOCAL}:3000
      NEXT_ANALYTICS_BACKEND_PROVIDER: postgres
    volumes:
      - ./volumes/snippets:/app/snippets

  inbucket:
    image: inbucket/inbucket:3.0.3
    container_name: supabase-inbucket
    restart: unless-stopped
    networks:
      - birdify-net
    ports:
      - "9000:9000"
      - "2500:2500"
      - "1100:1100"
